# Quick Test Configuration
# ==============================================================================
# Cấu hình dùng để kiểm tra nhanh hệ thống pipeline (chạy thử nghiệm 1 cấu hình).
# Dùng lệnh: python benchmark.py --config configs/quick_test.yaml

benchmark_id: "dsa_quick_test"
seed: 42

dataset:
  name: "DSA_Benchmark"
  version: "1.0"
  path: "datasets/dsa_benchmark_v1.json"

models:
  embedding_model: "nomic-embed-text"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  judge_model: "qwen2.5:14b"
  generator_model: "qwen2.5-coder:7b"

# Chỉ thử nghiệm 1 chiến lược để verify hệ thống
matrix:
  chunking:
    - "semantic"
  chunk_sizes:
    - 300

static_params:
  retrieval_mode: "hybrid"
  top_k_retrieve: 20
  top_k_rerank: 4
  bm25_weight: 0.4
  vector_weight: 0.6
  overlap_ratio: 0.10
  parent_size: 1200
