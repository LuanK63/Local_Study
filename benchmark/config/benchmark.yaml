# Full Benchmark Configuration Matrix
# ==============================================================================
# File cấu hình định nghĩa ma trận toàn diện 15 chiến lược chunking
# để phục vụ đánh giá trong khóa luận.

benchmark_id: "dsa_full_benchmark"
seed: 42

dataset:
  name: "DSA_Benchmark"
  version: "1.0"
  path: "datasets/dsa_benchmark_v1.json"

models:
  embedding_model: "nomic-embed-text"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  judge_model: "qwen2.5:14b"
  generator_model: "qwen2.5-coder:7b"

# Ma trận cấu hình chunking
# ==============================================================================
# Tổng số cấu hình = len(chunking) * len(chunk_sizes) = 5 * 3 = 15
matrix:
  chunking:
    - "fixed"
    - "sentence"
    - "recursive"
    - "semantic"
    - "parent_child"

  chunk_sizes:
    - 200
    - 300
    - 500

# Tham số tĩnh áp dụng chung cho mọi cấu hình trong matrix
static_params:
  retrieval_mode: "hybrid"  # BM25 + Dense
  top_k_retrieve: 20        # Số lượng chunk lấy từ VectorDB/BM25
  top_k_rerank: 4           # Số lượng chunk sau khi đi qua MiniLM Cross-Encoder
  bm25_weight: 0.4
  vector_weight: 0.6
  # Quy tắc overlap: overlap = chunk_size * overlap_ratio (tức là 10%)
  overlap_ratio: 0.10
  # Kích thước parent chunk cố định dùng riêng cho chiến lược parent_child
  parent_size: 1200
