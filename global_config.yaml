llm:
  model: "qwen2.5-coder:7b"
  fallback_model: "qwen2.5-coder:3b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout: 120

judge_model:
  provider: ollama
  model_name: qwen2.5:14b
  temperature: 0
  num_ctx: 4096
  timeout: 600

generator_model:
  provider: ollama
  model_name: qwen2.5-coder:7b

embedding:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

retrieval:
  # Active chunking strategy (fixed | recursive | semantic | parent_child)
  chunking_strategy: "recursive"

  # Parent-Child Chunking
  parent_chunk_size: 1200   # ký tự — chunk lớn gửi cho LLM (1 mục/khái niệm đầy đủ)
  child_chunk_size: 300     # ký tự — chunk nhỏ để embed + search
  child_chunk_overlap: 30   # ký tự gối nhau giữa child chunks

  # Fixed Chunker
  fixed_chunk_size: 512
  fixed_chunk_overlap: 102

  # Recursive Chunker
  recursive_chunk_size: 512
  recursive_chunk_overlap: 102

  # Semantic Chunker
  semantic_threshold_factor: 1.2

  # Alias cho backward-compat
  chunk_size: 512
  chunk_overlap: 102

  top_k: 5
  bm25_weight: 0.4
  vector_weight: 0.6
  # search_mode: hybrid | semantic | bm25
  # hybrid  = BM25 + Vector với RRF fusion (mặc định, tốt nhất cho tiếng Việt kỹ thuật)
  # semantic = chỉ Vector search (embedding similarity)
  # bm25     = chỉ BM25 keyword search
  search_mode: hybrid
  hyde:
    enabled: false
    temperature: 0.3

sandbox:
  timeout_seconds: 5
  max_output_chars: 5000
  temp_dir: "data/sandbox"
  gcc_path: "gcc"
  gpp_path: "g++"

database:
  path: "data/study_agent.db"

chromadb:
  path: "data/chroma_db"
