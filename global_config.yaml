llm:
  model: "qwen2.5-coder:7b"
  fallback_model: "qwen2.5-coder:3b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout: 300

judge_model:
  provider: ollama
  model_name: qwen2.5:14b
  temperature: 0
  num_ctx: 4096
  timeout: 600

generator_model:
  provider: ollama
  model_name: qwen2.5-coder:7b

embedding:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

retrieval:

  # fixed | recursive | token | sentence | paragraph | semantic | parent_child
  chunking_strategy: "parent_child"

  # Parent-Child Chunking
  parent_chunk_size: 1200
  child_chunk_size: 300
  child_chunk_overlap: 30


  # Fixed Chunking
  fixed_chunk_size: 512
  fixed_chunk_overlap: 100


  # Recursive Chunking
  recursive_chunk_size: 512
  recursive_chunk_overlap: 100


  # Token Chunking
  token_chunk_size: 256
  token_chunk_overlap: 50


  # Sentence Chunking
  sentence_count: 5
  overlap_sentences: 1


  # Paragraph Chunking
  paragraphs_per_chunk: 1
  overlap_paragraphs: 0


  # Semantic Chunking
  semantic_threshold_factor: 1.2
  # Backward Compatibility
  chunk_size: 512
  chunk_overlap: 100


  top_k: 5
  bm25_weight: 0.5
  vector_weight: 0.5
  # search_mode: hybrid | semantic | bm25
 
  search_mode: hybrid
  hyde:
    enabled: false
    temperature: 0.3

rag:
  mode: pure_rag
  enable_rewrite: false
  enable_crag: false
  
  rewrite_similarity_threshold: 0.40

sandbox:
  timeout_seconds: 5
  max_output_chars: 5000
  temp_dir: "data/sandbox"
  gcc_path: "gcc"
  gpp_path: "g++"

database:
  path: "data/study_agent.db"

chromadb:
  path: "data/chroma_db"
