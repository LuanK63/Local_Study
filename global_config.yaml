llm:
  model: "qwen2.5-coder:7b"
  fallback_model: "qwen2.5-coder:3b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout: 120

embedding:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

retrieval:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  bm25_weight: 0.4
  vector_weight: 0.6

sandbox:
  timeout_seconds: 5
  max_output_chars: 5000
  temp_dir: "data/sandbox"
  gcc_path: "gcc"
  gpp_path: "g++"

database:
  path: "data/study_agent.db"

chromadb:
  path: "data/chroma_db"
