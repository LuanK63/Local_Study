llm:
  model: "qwen2.5-coder:7b"
  fallback_model: "qwen2.5-coder:3b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout: 120

embedding:
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"

retrieval:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  bm25_weight: 0.4
  vector_weight: 0.6
  # ── HyDE (Hypothetical Document Embeddings) ────────────────────
  hyde: True                 # bật/tắt HyDE vector search
  
  # ── Multi-Query Expansion ─────────────────────────────────────
  query_expansion: True      # bật/tắt multi-query expansion
  query_variants: 2          # số lượng câu hỏi biến thể sinh thêm
  retrieval_multiplier: 2    # hệ số nhân số lượng chunk fetch trước khi fusion (fetch_k = top_k * multiplier)

sandbox:
  timeout_seconds: 5
  max_output_chars: 5000
  temp_dir: "data/sandbox"
  gcc_path: "gcc"
  gpp_path: "g++"

database:
  path: "data/study_agent.db"

chromadb:
  path: "data/chroma_db"
